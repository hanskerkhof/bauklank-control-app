<button
  type="button"
  class="command-button"
  aria-haspopup="dialog"
  (click)="openDialog()"
>
  <span aria-hidden="true">⚙️</span>
  <span class="visually-hidden">Open command modal</span>
</button>

<dialog #dialog class="command-modal">
  <form method="dialog" class="command-modal__container">
    <header class="command-modal__header">
      <h3 class="command-modal__title">Command placeholder</h3>
      <button type="submit" class="command-modal__close" aria-label="Close dialog">&times;</button>
    </header>
    <div class="command-modal__body">
      Placeholder content for a future command configuration.
    </div>
    <footer class="command-modal__footer">
      <button
        type="button"
        class="command-modal__button command-modal__button--primary"
        (click)="execute()"
      >
        Execute
      </button>
      <button type="submit" class="command-modal__button command-modal__button--secondary">Cancel</button>
    </footer>
  </form>
</dialog>
