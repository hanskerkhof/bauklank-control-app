<nav class="nav" aria-label="Main navigation">
  @for (link of links; track link.path) {
    <a
      class="nav__link"
      [routerLink]="link.path"
      routerLinkActive="nav__link--active"
      [routerLinkActiveOptions]="{ exact: link.path[0] === '/' }"
    >
      {{ link.label }}
    </a>
  }
</nav>
