<tui-root>
  <div class="app-container">
    <app-ws-status></app-ws-status>

    <main class="layout" aria-label="BAUKLANK control">
      <header class="topbar">
        <div class="brand">
          <h1 class="tui-text_h1 app-title">BAUKLANK CONTROL</h1>
          <app-navigation-bar></app-navigation-bar>
        </div>
      </header>
      <section class="content">
        <app-sound-library-summary [summary]="state.soundLibrarySummary()"></app-sound-library-summary>

        @if (state.activePlanLabel(); as activePlanLabel) {
          <div class="active-plan">
            <span class="active-plan__label">Active plan:</span>
            <span class="active-plan__value">{{ activePlanLabel }}</span>
          </div>
        }

        @if (state.plans().length) {
          <div class="plan-actions">
            <app-plan-selector
              class="plan-actions__selector"
              [plans]="state.sortedPlans()"
              [activePlanId]="state.activePlanId()"
              (setPlan)="handleSetPlan($event)"
            ></app-plan-selector>

            <app-artnet-config class="plan-actions__config"></app-artnet-config>

            <div class="restart-control">
              <button
                type="button"
                class="restart-control__button"
                [disabled]="state.isRestarting()"
                (click)="handleRestart()"
              >
                Restart
              </button>
              @if (state.isRestarting()) {
                <span class="restart-control__status" role="status" aria-live="polite">
                  <span class="restart-control__spinner" aria-hidden="true"></span>
                  Restarting…
                </span>
              }
            </div>
          </div>
        }

        <router-outlet></router-outlet>
      </section>
    </main>
  </div>
</tui-root>
