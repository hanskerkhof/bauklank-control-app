<tui-root>
  <div class="app-container">
    <app-ws-status></app-ws-status>

    <main class="layout" aria-label="BAUKLANK control">
      <header class="topbar">
        <h1 class="tui-text_h1 app-title">BAUKLANK CONTROL</h1>
      </header>
      <section class="content">
        @if (soundLibrarySummary(); as soundLibrarySummary) {
          <div class="sound-library">
            <span class="sound-library__label">Sound library:</span>
            <span class="sound-library__value">{{ soundLibrarySummary }}</span>
          </div>
        }

        @if (activePlanLabel(); as activePlanLabel) {
          <div class="active-plan">
            <span class="active-plan__label">Active plan:</span>
            <span class="active-plan__value">{{ activePlanLabel }}</span>
          </div>
        }

        @if (plans().length) {
          <div class="plan-actions">
            <app-plan-selector
              class="plan-actions__selector"
              [plans]="sortedPlans()"
              [activePlanId]="activePlanId()"
              (setPlan)="handleSetPlan($event)"
            ></app-plan-selector>

            <div class="restart-control">
              <button
                type="button"
                class="restart-control__button"
                [disabled]="isRestarting()"
                (click)="handleRestart()"
              >
                Restart
              </button>
              @if (isRestarting()) {
                <span class="restart-control__status" role="status" aria-live="polite">
                  <span class="restart-control__spinner" aria-hidden="true"></span>
                  Restarting…
                </span>
              }
            </div>
          </div>
        }
        <app-dmx-viewer [dmx]="dmx()"></app-dmx-viewer>
      </section>
    </main>
  </div>
</tui-root>
